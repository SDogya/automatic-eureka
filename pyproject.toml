[project]
name = "genome8"
version = "0.1.0"
description = "Metropolis–Hastings and a masked JAX MLP on eight DNA symbols"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jax",
    "optax",
    "numpy>=2",
    "pydantic>=2,<3",
    "pyarrow",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

