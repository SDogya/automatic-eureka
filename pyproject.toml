[project]
name = "trafl-kek"
version = "0.1.0"
description = "Exact study of TraFL trajectory-balance post-training on length-8 DNA (Potts + TFBind8)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jax",
    "optax",
    "numpy>=2",
    "pydantic>=2,<3",
    "pyarrow",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

